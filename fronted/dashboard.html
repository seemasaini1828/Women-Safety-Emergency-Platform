<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">🛡 Women Safety Dashboard</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="Contacts.html">Contacts</a>
        <a href="history.html">History</a>
        <a href="volunteer.html">Volunteer</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>

</header>

<section class="dashboard">

    <h2>Welcome to Dashboard</h2>

    <div class="card-container">

        <div class="card">
            <h3>🚨 SOS Alert</h3>
            <p>Send emergency alert instantly</p>
            <button onclick="sendSOS()">Send SOS</button>
        </div>

        <div class="card">
            <h3>📞 Contacts</h3>
            <p>Manage emergency contacts</p>
            <button onclick="window.location.href='Contacts.html'">Open</button>
        </div>

        <div class="card">
            <h3>📊 History</h3>
            <p>View past SOS alerts</p>
            <button onclick="window.location.href='history.html'">View</button>
        </div>

        <div class="card">
            <h3>🤝 Volunteer</h3>
            <p>Join safety volunteers</p>
            <button onclick="window.location.href='volunteer.html'">Join</button>
        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
